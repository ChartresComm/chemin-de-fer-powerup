<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <script src="https://p.trellocdn.com/power-up.min.js"></script>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body class="settings-body">
  <form id="settings-form">
    <label for="template">Modèle de publication</label>
    <select id="template"></select>

    <div id="custom-fields" style="display:none;">
      <label for="totalPages">Nombre total de pages</label>
      <input type="number" id="totalPages" min="1" max="400">

      <label for="columns">Planches par ligne</label>
      <input type="number" id="columns" min="1" max="12">
    </div>

    <label for="startPage">Numéro de la première page (pagination de départ)</label>
    <input type="number" id="startPage" min="1" max="50">

    <label for="statusFieldName">Nom du champ personnalisé « Statut »</label>
    <input type="text" id="statusFieldName" placeholder="Statut">

    <label for="archivedListName">Nom de la liste dont les cartes doivent disparaître du chemin de fer</label>
    <input type="text" id="archivedListName" placeholder="Archivées">

    <label for="editionsListName">Nom de la liste où archiver les éditions (créée si absente)</label>
    <input type="text" id="editionsListName" placeholder="Éditions">

    <button type="submit" class="mod-primary">Enregistrer</button>
  </form>

  <script src="./js/common.js"></script>
  <script src="./js/settings.js"></script>
</body>
</html>
