<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <script src="https://p.trellocdn.com/power-up.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body class="cdf-body">
  <header class="cdf-header">
    <div class="cdf-header-meta">
      <input type="text" id="cdf-title" class="cdf-title-input" placeholder="Titre du chemin de fer (ex : Numéro de septembre 2026)">
      <label class="cdf-date-label">Bouclage
        <input type="date" id="cdf-closing-date">
      </label>
      <label class="cdf-date-label">Distribution
        <input type="date" id="cdf-distribution-date">
      </label>
    </div>
    <div class="cdf-header-actions">
      <span id="cdf-status" class="cdf-status"></span>
      <button id="cdf-settings" class="mod-secondary">Réglages</button>
      <button id="cdf-refresh" class="mod-secondary">Actualiser les cartes</button>
      <button id="cdf-history" class="mod-secondary">Historique</button>
      <button id="cdf-new" class="mod-secondary">Nouveau chemin de fer</button>
      <button id="cdf-export" class="mod-primary">Exporter en PDF</button>
    </div>
  </header>

  <div class="cdf-layout">
    <aside class="cdf-sidebar">
      <h2>Cartes non placées</h2>
      <select id="cdf-label-filter" class="cdf-label-filter">
        <option value="">Toutes les étiquettes</option>
      </select>
      <ul id="unassigned-list" class="cdf-card-list" data-spread="unassigned"></ul>
    </aside>

    <main id="cdf-grid" class="cdf-grid"></main>
  </div>

  <!-- Dialogue : nouveau chemin de fer -->
  <div id="cdf-new-overlay" class="cdf-overlay">
    <div class="cdf-overlay-box">
      <h3>Nouveau chemin de fer</h3>
      <p class="cdf-overlay-hint">C'est ici que tu archives le chemin de fer actuel (« <span id="cdf-new-current-title"></span> ») : il sera enregistré tel quel dans l'Historique (consultable en lecture seule), puis la grille sera remise à zéro pour le prochain numéro.</p>
      <label for="cdf-new-title">Titre du nouveau chemin de fer</label>
      <input type="text" id="cdf-new-title" placeholder="ex : Numéro de décembre 2026">
      <label for="cdf-new-base">Partir de</label>
      <select id="cdf-new-base">
        <option value="template">Le modèle actuel (pagination et rubriques conservées, cartes retirées)</option>
        <option value="scratch">Zéro (pagination et rubriques à reconfigurer)</option>
      </select>
      <div class="cdf-overlay-actions">
        <button id="cdf-new-cancel" class="mod-secondary">Annuler</button>
        <button id="cdf-new-confirm" class="mod-primary">Enregistrer et repartir</button>
      </div>
    </div>
  </div>

  <!-- Dialogue : historique figé -->
  <div id="cdf-history-overlay" class="cdf-overlay">
    <div class="cdf-overlay-box cdf-overlay-box-wide">
      <div id="cdf-history-list-view">
        <h3>Historique des chemins de fer</h3>
        <ul id="cdf-history-list" class="cdf-history-list"></ul>
        <div class="cdf-overlay-actions">
          <button id="cdf-history-clear" class="mod-danger">Supprimer tout l'historique</button>
          <button id="cdf-history-close" class="mod-secondary">Fermer</button>
        </div>
      </div>
      <div id="cdf-history-detail-view" style="display:none;">
        <h3 id="cdf-history-detail-title"></h3>
        <p id="cdf-history-detail-dates" class="cdf-overlay-hint"></p>
        <div id="cdf-history-detail-grid" class="cdf-grid cdf-grid-readonly"></div>
        <div class="cdf-overlay-actions">
          <button id="cdf-history-back" class="mod-secondary">← Retour à la liste</button>
        </div>
      </div>
    </div>
  </div>

  <script src="./js/common.js"></script>
  <script src="./js/chemin-de-fer.js"></script>
</body>
</html>
